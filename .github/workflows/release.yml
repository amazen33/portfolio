name: release

# A pushed v* tag builds and checks the site exactly as CI does, then creates a GitHub
# Release with the tested build attached: a pre-release for -rc/-alpha/-beta tags, a draft
# for stable tags (the owner publishes it, then deploys that asset). A manual run only validates.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to validate against the current main (dry run, creates nothing), e.g. v1.0.0-rc.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      BRANCH_RULE: main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, version, changelog and branch
        id: check
        run: python3 .github/scripts/release_check.py tag "$TAG" --branch "$BRANCH_RULE" --notes "$RUNNER_TEMP/notes.md" --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Check the build output
        run: |
          test -f dist/index.html
          test -f dist/cv.html
          test -f dist/_headers
          ! grep -R -n -E "\+20[0-9]{8,}|amazen33@hotmail" dist/ || { echo "Private contact detail found in build output"; exit 1; }
      - name: Package the tested build
        run: |
          (cd dist && zip -q -r "$RUNNER_TEMP/site-dist-$TAG.zip" .)
          sha256sum "$RUNNER_TEMP/site-dist-$TAG.zip" | tee "$RUNNER_TEMP/site-dist-$TAG.zip.sha256"
      - name: Show the release payload
        env:
          PRERELEASE: ${{ steps.check.outputs.prerelease }}
        run: |
          echo "tag=$TAG prerelease=$PRERELEASE event=$GITHUB_EVENT_NAME"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.check.outputs.prerelease }}
        run: |
          kind="--draft"
          if [ "$PRERELEASE" = "true" ]; then kind="--prerelease"; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag $kind --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/site-dist-$TAG.zip" "$RUNNER_TEMP/site-dist-$TAG.zip.sha256"
